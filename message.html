
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Little Message for You | Dr. Reyn Pandey</title>

  <meta name="description"
        content="A little message of kindness, blessings, and gratitude from Dr. Reyn Pandey.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #d9efff, #f5f9ff, #dce8ff);
      color: #23395d;
    }

    .message-card {
      max-width: 430px;
      width: 100%;
      padding: 35px 25px;
      text-align: center;
      background: #ffffff;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(35, 57, 93, 0.12);
    }

    .heart {
      font-size: 45px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 25px;
      line-height: 1.5;
      color: #1877f2;
    }

    p {
      font-size: 17px;
      line-height: 1.8;
      margin: 20px 0;
    }

    .signature {
      font-weight: bold;
      color: #1877f2;
      margin-top: 25px;
    }

    .back-button {
      display: inline-block;
      margin-top: 15px;
      padding: 11px 20px;
      background: #1877f2;
      color: #ffffff;
      text-decoration: none;
      border-radius: 25px;
      font-size: 14px;
      transition: background 0.3s ease;
    }

    .back-button:hover {
      background: #105fc5;
    }
  </style>
</head>

<body>
  <main class="message-card">

    <div class="heart">❤️</div>

    <h1>You Are a Beautiful Soul on This Planet!</h1>

    <p>
      Best wishes to you.<br>
      May God always bless you. 🙏
    </p>

    <p>
      Thank you for visiting my profile. 💙
    </p>

    <p class="signature">
      With best wishes,<br>
      Dr. Reyn Pandey
    </p>

    <a href="index.html" class="back-button">
      ← Back to My Profile
    </a>

  </main>
</body>
</html>
